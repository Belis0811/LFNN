[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfnn-resnet101-partial-leadership"
version = "0.1.0"
description = "ResNet-101 partial-leadership training implementation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

